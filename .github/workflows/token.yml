name: Actualizar token y lista M3U

on:
  schedule:
    - cron: '*/10 * * * *'   # cada 10 minutos (UTC)
  workflow_dispatch:           # permite ejecutarlo a mano desde la pestaña Actions

permissions:
  contents: write              # necesario para que GITHUB_TOKEN pueda hacer push

concurrency:
  group: actualizar-token
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Instalar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Instalar dependencias
        run: npm ci

      - name: Instalar navegador de Playwright
        run: npx playwright install --with-deps chromium

      - name: Ubicación del runner
        run: curl -s https://ipinfo.io/json | grep -E '"(country|region|org)"' || true

      - name: Obtener token
        run: node obtener_token.js

      - name: Subir diagnóstico
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: diagnostico
          path: debug/
          retention-days: 7

      - name: Actualizar lista M3U
        run: node actualizar_lista.js

      - name: Commit y push de lista.m3u
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lista.m3u
          if git diff --cached --quiet; then
            echo "lista.m3u no cambió; no hay nada que subir."
            exit 0
          fi
          git commit -m "Actualizar lista.m3u ($(date -u +'%Y-%m-%d %H:%M UTC'))"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
